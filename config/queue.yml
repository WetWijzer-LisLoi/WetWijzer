default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # SQLite has a single writer. A 100ms poll loop needlessly contends with
      # recurring-task inserts on this low-volume queue.
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
