# Reviewed relations between a law and the parliamentary dossiers that
# prepared it (WW-LINK-01). Read by ParliamentaryRelations::Manifest.
#
# A law listed here shows exactly these dossiers as its preparatory works, on
# the law page's panel, its "view all" list, its metadata and the dossier's
# document pages. The corpus's automatic links for it (documents carrying the
# law's NUMAC, legislation.parliamentary_refs) are not shown. Every other law
# keeps its automatic links, labelled as automatically linked.
#
# An entry needs primary-source evidence that names the exact dossier: the
# official dossier page of the Chamber or the Senate. Never add one from title
# similarity or a NUMAC found in the corpus; propose it in the audit report
# (lib/tasks/parliamentary_relations.rake) and have it reviewed. Quote every
# NUMAC: an all-digit one would load as a number.
