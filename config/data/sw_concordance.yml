  - heading_nl: "Zedenmisdrijven: oude artikelen (opgeheven 01/06/2022)"
    # the 2022 reform inserted arts 417/1-417/65 into the OLD code, so these
    # targets resolve there, not in the Wetboek of 2024
    new_numac: "1867060850"
    heading_fr: "Infractions sexuelles: anciens articles (abrogés le 01/06/2022)"
    note_nl: "De hervorming van 21 maart 2022 heeft deze artikelen niet hernummerd maar herschreven: het hele hoofdstuk is vervangen door de artikelen 417/5 e.v. van het oude Strafwetboek. Daardoor bestaat er geen artikelsgewijze concordantie, ook niet in de parlementaire voorbereiding; de wetgever heeft de opvolging enkel in bulk herformuleerd in de verwijzingsartikelen van de hervormingswet. Hieronder staat een specifiek artikel alleen waar de opvolging vaststaat; in de overige gevallen verwijzen we naar het hervormingsblok als geheel. De afdeling \"Zedenmisdrijven na de hervorming van 2022\" hieronder brengt die artikelen 417/x verder naar het nieuwe Strafwetboek."
    note_fr: "La réforme du 21 mars 2022 n'a pas renuméroté ces articles mais les a réécrits: tout le chapitre a été remplacé par les articles 417/5 et suivants de l'ancien Code pénal. Il n'existe donc pas de concordance article par article, pas même dans les travaux préparatoires; le législateur n'a reformulé la succession qu'en bloc, dans les articles de renvoi de la loi de réforme. Ci-dessous, un article précis n'est indiqué que lorsque la succession est établie; sinon, le renvoi vise le bloc de la réforme. La section \"Infractions sexuelles après la réforme de 2022\" ci-dessous mène ces articles 417/x vers le nouveau Code pénal."
    entries:
