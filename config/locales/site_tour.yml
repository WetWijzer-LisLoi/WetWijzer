nl:
  site_tour:
    entry: "Eerste keer dat u deze website bezoekt? Probeer onze tovenaar!"
    entry_button: "Start de tovenaar"
    title: "Wegwijs in %{site_name}"
    close: "Tovenaar sluiten"
    open: "Open de tovenaar"
    previous: "Vorige"
    next: "Volgende"
    finish: "Klaar"
    contents: "Inhoud"
    step_counter: "Stap %{current} van %{total}"
    fallback_intro: "Lees deze gids in uw eigen tempo. Open een onderdeel voor de uitleg."
    steps:
      - title: "Kies uw weg"
        body: "Zoek zelf rechtstreeks in de bronnen, of stel de juridische chatbot uw vraag in gewone taal. De tovenaar voert niets uit en verandert geen instellingen."
      - title: "Zoeken in alle bronnen"
        body: "Gebruik Zoeken voor directe/verenigde zoekresultaten in wetgeving, rechtspraak en parlementaire stukken. Kies Bronnen, open Filters en gebruik sortering en paginering bij de resultaten."
      - title: "Wetten lezen en gebruiken"
        body: "Open een wet voor de inhoudsopgave, zijbalk, artikelen en verwijzingen. U kunt artikelen kopiëren, een wet exporteren, versies vergelijken en Verwante documenten of bronnen bekijken wanneer die voor het document bestaan."
      - title: "Rechtspraak en parlement"
        body: "De aparte pagina's Rechtspraak en Parlementaire werkzaamheden helpen u arresten, dossiers en documenten verder verkennen. Gebruik de zoek- en filterbesturing op die pagina's."
      - title: "De juridische chatbot"
        body: "De chatbot kan antwoorden met bronverwijzingen. Kies alleen een intelligentieniveau dat voor uw account beschikbaar is en beoordeel antwoorden. Geschiedenis is opt-in: zonder die keuze wordt geen ruwe gespreksinhoud opgeslagen. Versleutelde geschiedenis vereist een opslagwachtwoord. AI-antwoorden zijn geen officieel juridisch advies en kunnen fouten bevatten."
      - title: "Bladwijzers en mappen"
        body: "Met een account kunt u wetten en andere ondersteunde resultaten bladwijzeren, ze in mappen ordenen en ze later openen via Bladwijzers."
      - title: "Profiel, facturatie en facturen"
        body: "Via Account beheert u uw profiel en facturatiegegevens. Daar vindt u ook betalingen en facturen die voor uw account beschikbaar zijn."
      - title: "Credits en Pro"
        body: "De pagina's Credits en Abonnement tonen beschikbare credits en Pro-opties. Betaling of een Pro-functie wordt pas gestart nadat u daarvoor zelf de passende knop kiest; beschikbaarheid en prijs kunnen per account verschillen."
      - title: "Beveiliging en gegevens"
        body: "In Account kunt u twee-factor-authenticatie en activiteitenoverzicht beheren waar beschikbaar. U kunt uw gegevens exporteren of accountverwijdering aanvragen; lees privacy en bevestigingen zorgvuldig."
      - title: "Uw voorkeuren en toegang"
        body: "Kies taal en thema, gebruik de website op mobiel of als PWA en gebruik zo nodig de Classic-presentatie. Beschikbare opties verschillen per apparaat, browser en account."
      - title: "Hulp en vertrouwen"
        body: "In de footer vindt u contact, ondersteuning, privacy, voorwaarden, toegankelijkheid en andere openbare beleidsinformatie. Raadpleeg de oorspronkelijke bronnen en vraag professioneel advies wanneer dat nodig is."
fr:
  site_tour:
    entry: "Première visite sur ce site ? Essayez notre assistant !"
    entry_button: "Démarrer l’assistant"
    title: "Découvrir %{site_name}"
    close: "Fermer l’assistant"
    open: "Ouvrir l’assistant"
    previous: "Précédent"
    next: "Suivant"
    finish: "Terminer"
    contents: "Sommaire"
    step_counter: "Étape %{current} sur %{total}"
    fallback_intro: "Consultez ce guide à votre rythme. Ouvrez une rubrique pour son explication."
    steps:
      - title: "Choisissez votre parcours"
        body: "Recherchez directement dans les sources ou posez votre question en langage courant au chatbot juridique. L’assistant n’effectue aucune action et ne modifie aucun réglage."
      - title: "Rechercher toutes les sources"
        body: "Utilisez Rechercher pour des résultats directs/unifiés dans législation, jurisprudence et travaux parlementaires. Choisissez Sources, ouvrez Filtres et utilisez tri et pagination."
      - title: "Lire et utiliser les lois"
        body: "Ouvrez une loi pour la table des matières, la barre latérale, les articles et références. Vous pouvez copier un article, exporter une loi, comparer des versions et consulter documents ou sources liés lorsqu’ils existent."
      - title: "Jurisprudence et parlement"
        body: "Les pages Jurisprudence et Travaux parlementaires permettent d’explorer arrêts, dossiers et documents. Utilisez les commandes de recherche et filtre de ces pages."
      - title: "Le chatbot juridique"
        body: "Le chatbot peut répondre avec des citations de sources. Choisissez seulement un niveau disponible pour votre compte et évaluez les réponses. L’historique est facultatif : sans ce choix, aucun contenu brut de conversation n’est stocké. L’historique chiffré requiert un mot de passe de stockage. Les réponses IA ne sont pas un avis juridique officiel et peuvent comporter des erreurs."
      - title: "Favoris et dossiers"
        body: "Avec un compte, vous pouvez ajouter aux favoris les lois et autres résultats pris en charge, les classer dans des dossiers et les rouvrir via Favoris."
      - title: "Profil, facturation et factures"
        body: "Dans Compte, gérez votre profil et vos données de facturation. Vous y trouvez aussi les paiements et factures disponibles pour votre compte."
      - title: "Crédits et Pro"
        body: "Les pages Crédits et Abonnement présentent les crédits et options Pro disponibles. Un paiement ou une fonction Pro ne commence qu’après votre choix explicite du bouton approprié; disponibilité et prix dépendent du compte."
      - title: "Sécurité et données"
        body: "Dans Compte, gérez l’authentification à deux facteurs et le journal d’activité lorsqu’ils sont disponibles. Vous pouvez exporter vos données ou demander la suppression du compte; lisez attentivement confidentialité et confirmations."
      - title: "Préférences et accès"
        body: "Choisissez langue et thème, utilisez le site sur mobile ou comme PWA, et utilisez la présentation Classic si nécessaire. Les options disponibles dépendent de l’appareil, du navigateur et du compte."
      - title: "Aide et confiance"
        body: "Le pied de page contient contact, assistance, confidentialité, conditions, accessibilité et autres informations publiques. Consultez les sources originales et demandez un avis professionnel si nécessaire."
de:
  site_tour:
    entry: "Zum ersten Mal auf dieser Website? Probieren Sie unseren Assistenten!"
    entry_button: "Assistent starten"
    title: "%{site_name} kennenlernen"
    close: "Assistent schließen"
    open: "Assistent öffnen"
    previous: "Zurück"
    next: "Weiter"
    finish: "Fertig"
    contents: "Inhalt"
    step_counter: "Schritt %{current} von %{total}"
    fallback_intro: "Lesen Sie diesen Leitfaden in Ihrem Tempo. Öffnen Sie einen Abschnitt für die Erklärung."
    steps:
      - title: "Ihren Weg wählen"
        body: "Durchsuchen Sie die Quellen direkt oder stellen Sie dem juristischen Chatbot Ihre Frage in Alltagssprache. Der Assistent führt nichts aus und ändert keine Einstellungen."
      - title: "Alle Quellen durchsuchen"
        body: "Nutzen Sie Suchen für direkte/vereinte Ergebnisse aus Gesetzgebung, Rechtsprechung und Parlamentsdokumenten. Wählen Sie Quellen, öffnen Sie Filter und nutzen Sie Sortierung und Seitennavigation."
      - title: "Gesetze lesen und nutzen"
        body: "Öffnen Sie ein Gesetz für Inhaltsverzeichnis, Seitenleiste, Artikel und Verweise. Sie können Artikel kopieren, Gesetze exportieren, Fassungen vergleichen und verwandte Dokumente oder Quellen ansehen, wenn sie existieren."
      - title: "Rechtsprechung und Parlament"
        body: "Die Seiten Rechtsprechung und Parlamentarische Arbeiten helfen bei Urteilen, Dossiers und Dokumenten. Nutzen Sie dort Suche und Filter."
      - title: "Der juristische Chatbot"
        body: "Der Chatbot kann mit Quellenangaben antworten. Wählen Sie nur eine verfügbare Intelligenzstufe und bewerten Sie Antworten. Verlauf ist optional: ohne Wahl wird kein roher Gesprächsinhalt gespeichert. Verschlüsselter Verlauf erfordert ein Speicherpasswort. KI-Antworten sind keine offizielle Rechtsberatung und können Fehler enthalten."
      - title: "Lesezeichen und Ordner"
        body: "Mit einem Konto können Sie Gesetze und andere unterstützte Ergebnisse als Lesezeichen speichern, in Ordnern ordnen und über Lesezeichen wieder öffnen."
      - title: "Profil, Abrechnung und Rechnungen"
        body: "Unter Konto verwalten Sie Profil und Abrechnungsdaten. Dort finden Sie auch die für Ihr Konto verfügbaren Zahlungen und Rechnungen."
      - title: "Credits und Pro"
        body: "Credits und Abonnement zeigen verfügbare Credits und Pro-Optionen. Eine Zahlung oder Pro-Funktion startet erst nach Ihrer ausdrücklichen Wahl der passenden Schaltfläche; Verfügbarkeit und Preis hängen vom Konto ab."
      - title: "Sicherheit und Daten"
        body: "Unter Konto verwalten Sie Zwei-Faktor-Authentifizierung und Aktivitätenübersicht, soweit verfügbar. Sie können Daten exportieren oder Kontolöschung anfordern; lesen Sie Datenschutz und Bestätigungen sorgfältig."
      - title: "Einstellungen und Zugang"
        body: "Wählen Sie Sprache und Thema, nutzen Sie die Website mobil oder als PWA und verwenden Sie bei Bedarf die Classic-Darstellung. Verfügbare Optionen hängen von Gerät, Browser und Konto ab."
      - title: "Hilfe und Vertrauen"
        body: "Im Footer finden Sie Kontakt, Support, Datenschutz, Bedingungen, Barrierefreiheit und weitere öffentliche Informationen. Prüfen Sie Originalquellen und holen Sie bei Bedarf professionellen Rat ein."
en:
  site_tour:
    entry: "First time visiting this website? Try our wizard!"
    entry_button: "Start the wizard"
    title: "Getting to know %{site_name}"
    close: "Close wizard"
    open: "Open wizard"
    previous: "Back"
    next: "Next"
    finish: "Done"
    contents: "Contents"
    step_counter: "Step %{current} of %{total}"
    fallback_intro: "Read this guide at your own pace. Open a section for its explanation."
    steps:
      - title: "Choose your route"
        body: "Search the sources directly, or ask the legal chatbot your question in plain language. The wizard takes no action and changes no settings."
      - title: "Search every source"
        body: "Use Search for direct/unified results across legislation, case law and parliamentary documents. Choose Sources, open Filters, and use result sorting and pagination."
      - title: "Read and use legislation"
        body: "Open a law for its table of contents, sidebar, articles and references. Copy an article, export a law, compare versions, and view Related documents or sources when they exist for that document."
      - title: "Case law and parliament"
        body: "Dedicated Case law and Parliamentary work pages let you explore rulings, dossiers and documents. Use those pages’ search and filter controls."
      - title: "The legal chatbot"
        body: "The chatbot can answer with source citations. Select only an intelligence level available to your account and rate answers. History is opt-in: without that choice, no raw conversation content is stored. Encrypted history requires a storage password. AI answers are not official legal advice and can be wrong."
      - title: "Bookmarks and folders"
        body: "With an account, bookmark laws and other supported results, organise them in folders, and reopen them from Bookmarks."
      - title: "Profile, billing and invoices"
        body: "Use Account to manage your profile and billing details. It also shows payments and invoices available for your account."
      - title: "Credits and Pro"
        body: "Credits and Subscription show available credits and Pro options. A payment or Pro feature starts only after you deliberately choose its button; availability and price can differ by account."
      - title: "Security and data"
        body: "Use Account to manage two-factor authentication and activity history where available. You can export your data or request account deletion; read privacy information and confirmations carefully."
      - title: "Preferences and access"
        body: "Choose language and theme, use the website on mobile or as a PWA, and use the Classic presentation when needed. Available options depend on device, browser and account."
      - title: "Help and trust"
        body: "The footer contains contact, support, privacy, terms, accessibility and other public-policy information. Check original sources and seek professional advice when needed."
