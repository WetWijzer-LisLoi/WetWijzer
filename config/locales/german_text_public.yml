# Translations for the German-source notice shown on law pages in non-German locales.
nl:
  german_text:
    heading: "Duitse tekst"
    labels:
      official_translation: "Officiële Duitse vertaling, gepubliceerd in het Belgisch Staatsblad%{published}. Opgesteld door de Centrale Dienst voor Duitse Vertalingen (Malmedy). De Nederlandse en Franse tekst zijn rechtsgeldig."
      official_translation_extracts: "Officiële Duitse vertaling van uittreksels uit deze tekst (niet de volledige tekst), gepubliceerd in het Belgisch Staatsblad%{published}. Opgesteld door de Centrale Dienst voor Duitse Vertalingen (Malmedy). De Nederlandse en Franse tekst zijn rechtsgeldig."
      unofficial_coordination: "Officieuze Duitse coördinatie, Belgisch Staatsblad%{published}, zonder rechtskracht."
      unofficial_coordination_extracts: "Officieuze coördinatie in het Duits van uittreksels uit deze tekst (niet de volledige tekst), Belgisch Staatsblad%{published}, zonder rechtskracht."
      original: "Originele Duitse tekst, Belgisch Staatsblad%{published}."
      dg_original: "Officiële Duitse originele tekst, gepubliceerd in het Belgisch Staatsblad%{published}. De Duitstalige Gemeenschap publiceert haar decreten en regeringsbesluiten in het Duits; de Nederlandse en Franse versies zijn vertalingen."
      zddu_consolidation: "Officieuze geconsolideerde versie van de Centrale Dienst voor Duitse Vertalingen%{state}, bron scta.be. De officiële vertalingen van de afzonderlijke wijzigingen zijn gepubliceerd in het Belgisch Staatsblad (gegevens in de tekst)."
      dg_coordinated: "Gecoördineerde versie van het Ministerie van de Duitstalige Gemeenschap, niet rechtsgeldig. Alleen de originele tekst gepubliceerd in het Belgisch Staatsblad is rechtsgeldig."
    sources:
      staatsblatt_de: "Belgisch Staatsblad"
      zddu: "Centrale Dienst voor Duitse Vertalingen (scta.be)"
      dg_ministry: "Ministerie van de Duitstalige Gemeenschap (ostbelgienlive.be)"
    source: "Bron"
    fetched_on: "opgehaald op %{date}"
    other_versions: "Andere taalversies onder dezelfde NUMAC"
    source_link: "Duitse tekst (bron)"
    eli_link: "ELI (Belgisch Staatsblad)"
    french_fallback: "Voor deze tekst is geen Duitse versie beschikbaar. De Franse tekst wordt weergegeven."
    german_available: "Voor deze tekst is een Duitse versie beschikbaar."
    show_german: "Duitse versie weergeven"
    show_version: "%{language}-versie weergeven"
