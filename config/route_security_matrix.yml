# Route/action security matrix (FBL-045).
#
# Every state-changing browser endpoint (POST/PATCH/PUT/DELETE) must have an
# entry here; test/integration/route_security_matrix_test.rb enumerates the
# live route set and FAILS when a new state-changing route lacks one, so this
# file cannot silently drift from the application.
#
# Fields:
#   auth       - none | session | admin_session | webhook_signature | harness_flag
#   csrf       - required | token_in_body | signed_exception | samesite_exception | none_public
#   ownership  - self | admin | token | n/a
#   rate_limit - the Rack::Attack throttle or controller limiter that applies
#   billing    - true when the action can charge credits or mutate billing
#   unauthorized - expected status for an unauthenticated/foreign caller
#
# Regenerate the human-readable table with: rails security:route_matrix
matrix:
  geo_challenges#create: { auth: none, csrf: required, ownership: n/a, rate_limit: req/ip, billing: false, unauthorized: n/a }
  sessions#create: { auth: none, csrf: required, ownership: n/a, rate_limit: login/ip, billing: false, unauthorized: n/a }
  sessions#destroy: { auth: session, csrf: required, ownership: self, rate_limit: req/ip, billing: false, unauthorized: 302 }
  sessions#reactivate: { auth: session, csrf: required, ownership: self, rate_limit: req/ip, billing: false, unauthorized: 302 }
  registrations#create: { auth: none, csrf: required, ownership: n/a, rate_limit: registration limiter (AuthRateLimiting), billing: false, unauthorized: n/a }
  registrations#resend_confirmation: { auth: none, csrf: required, ownership: n/a, rate_limit: AuthRateLimiting, billing: false, unauthorized: n/a }
  password_resets#create: { auth: none, csrf: required, ownership: n/a, rate_limit: password_reset/ip + password_reset/email, billing: false, unauthorized: n/a }
  password_resets#update: { auth: none, csrf: required, ownership: token, rate_limit: password_reset/ip, billing: false, unauthorized: 302 }
  subscriptions#checkout: { auth: session, csrf: required, ownership: self, rate_limit: req/ip, billing: true, unauthorized: 302 }
  subscriptions#cancel: { auth: session, csrf: required, ownership: self, rate_limit: req/ip, billing: true, unauthorized: 302 }
  subscriptions#reactivate: { auth: session, csrf: required, ownership: self, rate_limit: req/ip, billing: true, unauthorized: 302 }
